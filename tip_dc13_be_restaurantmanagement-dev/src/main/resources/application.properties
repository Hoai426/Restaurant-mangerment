spring.config.import=optional:file:.env[.properties]

spring.application.name=restaurant-management-be

# Port: doc bien PORT do PaaS (Render/Railway/Heroku) inject, mac dinh 8080
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=20s

# Actuator: health check cho PaaS/K8s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# Khong de health check phu thuoc SMTP (co the treo neu cong bi chan)
management.health.mail.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
# Bat log SQL bang bien moi truong JPA_SHOW_SQL=true (mac dinh tat o production)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# CORS: danh sach origin duoc phep, phan tach bang dau phay
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Flyway: KHONG tu dong baseline tren schema da co du lieu (tranh bo qua V1)
# Chi bat tam khi danh dau DB cu: FLYWAY_BASELINE_ON_MIGRATE=true + FLYWAY_BASELINE_VERSION=<n>
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tranh treo vo han khi SMTP khong ket noi duoc (Render Free chan vai cong)
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

# Dia chi gui hien thi (voi Brevo phai la sender da xac minh). Bo trong = dung MAIL_USERNAME
app.mail.from=${MAIL_FROM:}

# Che do demo: false = khong gui mail that, chi log OTP (dung OTP_DEMO_CODE)
app.mail.enabled=${MAIL_ENABLED:true}

admin.username=${ADMIN_USERNAME}
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.phone=${ADMIN_PHONE:+1000000000}

otp.expiration-minutes=5
otp.max-attempts=5
# Chi dung khi demo (MAIL_ENABLED=false): OTP co dinh, vi du 123456
otp.demo-code=${OTP_DEMO_CODE:}